name: Build and deploy NovaX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NovaX
        uses: actions/checkout@v4

      - name: Import the actual Cosmic Racer League game
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Import NovaX racing game and remove Replit dependency' }}
        run: |
          git clone --depth 1 https://github.com/JoelEngelman/cosmicracerleague.git /tmp/cosmicracerleague
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/cosmicracerleague/ ./
          rm -f .replit .replitignore replit.md
          find . -name '.replit' -o -name '.replitignore' -o -name 'replit.md' | xargs -r rm -f

      - name: Remove Replit dependencies and configure GitHub Pages
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Import NovaX racing game and remove Replit dependency' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['node_modules', '.git'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name === 'package.json') {
                const pkg = JSON.parse(fs.readFileSync(full, 'utf8'));
                let changed = false;
                for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
                  if (!pkg[section]) continue;
                  for (const key of Object.keys(pkg[section])) {
                    if (key.startsWith('@replit/')) {
                      delete pkg[section][key];
                      changed = true;
                    }
                  }
                }
                if (full === 'artifacts/3d-game/package.json') {
                  delete pkg.dependencies?.['@workspace/api-client-react'];
                  pkg.name = 'novax';
                  changed = true;
                }
                if (changed) fs.writeFileSync(full, JSON.stringify(pkg, null, 2) + '\n');
              }
            }
          }
          walk('.');

          const vitePath = 'artifacts/3d-game/vite.config.ts';
          let vite = fs.readFileSync(vitePath, 'utf8');
          vite = vite.replace(/export default defineConfig\(\{/g, "export default defineConfig({\n  base: '/novax/',");
          vite = vite.replace(/\n\s*plugins:\s*\[[\s\S]*?\],\n\n\s*resolve:/, (m) => {
            const match = m.match(/plugins:\s*\[([\s\S]*?)\]/);
            if (!match) return m;
            const kept = match[1].split(',').filter(x => !x.includes('@replit/')).join(',');
            return m.replace(match[1], kept);
          });
          fs.writeFileSync(vitePath, vite);

          const wsPath = 'pnpm-workspace.yaml';
          if (fs.existsSync(wsPath)) {
            let ws = fs.readFileSync(wsPath, 'utf8');
            ws = ws.replace(/^\s*- '@replit\/\*'\n/m, '');
            ws = ws.replace(/^\s*- stripe-replit-sync\n/m, '');
            ws = ws.replace(/^\s+'@replit\/vite-plugin-cartographer':.*\n/m, '');
            ws = ws.replace(/^\s+'@replit\/vite-plugin-dev-banner':.*\n/m, '');
            ws = ws.replace(/^\s+'@replit\/vite-plugin-runtime-error-modal':.*\n/m, '');
            fs.writeFileSync(wsPath, ws);
          }

          if (fs.existsSync('pnpm-lock.yaml')) fs.rmSync('pnpm-lock.yaml');
          NODE

      - name: Commit imported game to NovaX
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Import NovaX racing game and remove Replit dependency' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import NovaX racing game and remove Replit dependency' || true
          git push

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build NovaX
        run: pnpm --filter novax run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/3d-game/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
