name: Import NovaX and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NovaX
        uses: actions/checkout@v4

      - name: Import the actual Cosmic Racer League game
        run: |
          git clone --depth 1 https://github.com/JoelEngelman/cosmicracerleague.git /tmp/cosmicracerleague
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/cosmicracerleague/. .
          rm -rf .git
          rm -f .replit .replitignore replit.md
          find . -name '.replit' -o -name '.replitignore' | xargs -r rm -f

      - name: Remove Replit-only build dependencies and configure Pages base path
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/3d-game/package.json';
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            if (!pkg[section]) continue;
            for (const key of Object.keys(pkg[section])) {
              if (key.startsWith('@replit/')) delete pkg[section][key];
              if (key === '@workspace/api-client-react') delete pkg[section][key];
            }
          }
          fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          node <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/3d-game/vite.config.ts';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace(/,\s*base:\s*['"][^'"]*['"]/g, '');
          s = s.replace(/export default defineConfig\(\{/g, "export default defineConfig({\n  base: '/novax/',");
          s = s.replace(/\n\s*plugins:\s*\[[\s\S]*?\],\n\n\s*resolve:/, (m) => {
            const block = m.match(/plugins:\s*\[([\s\S]*?)\]/);
            if (!block) return m;
            const kept = block[1].split(',').filter(x => !x.includes('replit')).join(',');
            return m.replace(block[1], kept);
          });
          fs.writeFileSync(p, s);
          NODE

      - name: Set project metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/3d-game/package.json';
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
          pkg.name = 'novax';
          fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Commit imported game to NovaX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import NovaX racing game and remove Replit dependency' || true
          git push

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build NovaX
        run: pnpm --filter novax run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/3d-game/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
